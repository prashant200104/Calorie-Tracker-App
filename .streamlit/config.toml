# NO [theme] section, on purpose.
#
# Streamlit follows the phone's light/dark setting only while it has no custom
# theme of its own. Declaring one -- even a single colour -- risks pinning the
# app to one mode, which is the opposite of what this app wants: ui/theme.py
# paints itself from the inherited text colour and follows wherever Streamlit
# goes. The red default accent on a few widgets is a cheap price for dark mode
# actually working.

[browser]
# No telemetry ping on each session.
gatherUsageStats = false
